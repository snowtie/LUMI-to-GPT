[package]
name = "lumi-to-gpt"
version = "1.0.5"
description = "Connect LUMI Chat to ChatGPT through the official Codex App Server OAuth flow"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-ico"] }
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
